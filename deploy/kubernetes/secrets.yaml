apiVersion: v1
kind: Secret
metadata:
  name: rag-api-secrets
  namespace: rag-system
type: Opaque
data:
  # Base64 encoded values - use the following commands to encode:
  # echo -n 'your-groq-api-key' | base64
  # echo -n 'your-langsmith-api-key' | base64
  groq-api-key: eW91ci1ncm9xLWFwaS1rZXk=
  langsmith-api-key: eW91ci1sYW5nc3htaW4tYXBpLWtleQ==
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-secrets
  namespace: rag-system
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded Docker registry secret
  # Create with: kubectl create secret docker-registry registry-secrets --docker-server=your-registry --docker-username=username --docker-password=password