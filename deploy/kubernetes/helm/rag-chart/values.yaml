# Default values for RAG API chart
replicaCount: 1

image:
  repository: rag-api
  pullPolicy: IfNotPresent
  tag: latest
  # Use private registry
  registry: ""
  imagePullSecrets: []

# Service configuration
service:
  type: LoadBalancer
  port: 80
  targetPort: 8000
  annotations: {}
  loadBalancerIP: ""
  externalTrafficPolicy: Local

# Ingress configuration (optional)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: rag-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource requests and limits
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Auto-scaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Persistence configuration
persistence:
  data:
    enabled: true
    size: 5Gi
    storageClassName: managed-premium
    accessMode: ReadWriteOnce
    mountPath: /app/data
  faiss:
    enabled: true
    size: 10Gi
    storageClassName: managed-premium
    accessMode: ReadWriteOnce
    mountPath: /app/faiss_store

# Environment variables
env:
  # Application settings
  RAG_DATA_DIR: "/app/data"
  RAG_PERSIST_DIR: "/app/faiss_store"
  RAG_EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  RAG_LLM_MODEL: "llama-3.3-70b-versatile"
  RAG_DEFAULT_TOP_K: "5"
  RAG_AUTO_BUILD_INDEX: "true"
  ENVIRONMENT: "Production"

# Secrets configuration
secrets:
  # Add your secrets here or reference external secrets
  groqApiKey: ""
  langsmithApiKey: ""

# Node affinity and tolerations
nodeAffinity: {}
tolerations: []

# Health check configuration
healthCheck:
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

# Security context
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security context
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# Monitoring configuration
monitoring:
  enabled: false
  prometheus:
    enabled: false
    port: 8000
    path: /metrics
  grafana:
    enabled: false
    dashboard: ""

# Logging configuration
logging:
  enabled: false
  logLevel: "INFO"
  logFormat: "json"
  fluentd:
    enabled: false
    host: ""
    port: 24224

# Network configuration
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: 1

# Service mesh configuration
serviceMesh:
  enabled: false
  istio:
    enabled: false
    gateway: ""

# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"