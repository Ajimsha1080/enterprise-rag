{{- if .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rag-chart.fullname" . }}-data-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-chart.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  {{- if .Values.persistence.data.storageClassName }}
  storageClassName: {{ .Values.persistence.data.storageClassName }}
  {{- end }}
{{- end }}
---
{{- if .Values.persistence.faiss.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rag-chart.fullname" . }}-faiss-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-chart.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.faiss.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.faiss.size }}
  {{- if .Values.persistence.faiss.storageClassName }}
  storageClassName: {{ .Values.persistence.faiss.storageClassName }}
  {{- end }}
{{- end }}