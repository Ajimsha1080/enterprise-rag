apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rag-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rag-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-chart.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rag-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.registry | default .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: RAG_DATA_DIR
              value: {{ .Values.env.RAG_DATA_DIR | quote }}
            - name: RAG_PERSIST_DIR
              value: {{ .Values.env.RAG_PERSIST_DIR | quote }}
            - name: RAG_EMBEDDING_MODEL
              value: {{ .Values.env.RAG_EMBEDDING_MODEL | quote }}
            - name: RAG_LLM_MODEL
              value: {{ .Values.env.RAG_LLM_MODEL | quote }}
            - name: RAG_DEFAULT_TOP_K
              value: {{ .Values.env.RAG_DEFAULT_TOP_K | quote }}
            - name: RAG_AUTO_BUILD_INDEX
              value: {{ .Values.env.RAG_AUTO_BUILD_INDEX | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | quote }}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-chart.fullname" . }}-secrets
                  key: groq-api-key
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag-chart.fullname" . }}-secrets
                  key: langsmith-api-key
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-volume
              mountPath: {{ .Values.persistence.data.mountPath }}
            - name: faiss-volume
              mountPath: {{ .Values.persistence.faiss.mountPath }}
          {{- if .Values.healthCheck.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.healthCheck.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.healthCheck.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.healthCheck.readinessProbe | nindent 12 }}
          {{- end }}
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "rag-chart.fullname" . }}-data-pvc
        - name: faiss-volume
          persistentVolumeClaim:
            claimName: {{ include "rag-chart.fullname" . }}-faiss-pvc
      {{- with .Values.nodeAffinity }}
      nodeAffinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}